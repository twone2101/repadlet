<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reverse Engineering - Padlet Clone</title>
    <link rel="icon" type="image/svg+xml" href="https://padlet.net/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'sans-serif'],
            },
            colors: {
              padlet: {
                pink: '#ff4081',
                pinkHover: '#f01b68',
                accent: '#09a2a5',
              }
            }
          }
        }
      }
    </script>
    <style>
      /* Clean, clearly visible scrollbars for all views */
      ::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }
      ::-webkit-scrollbar-track {
        background: rgba(0, 0, 0, 0.08);
        border-radius: 9999px;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(0, 0, 0, 0.35);
        border-radius: 9999px;
        border: 2px solid transparent;
        background-clip: content-box;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(244, 63, 94, 0.7); /* Pink accent on hover */
        border: 2px solid transparent;
        background-clip: content-box;
      }

      /* Firefox scrollbar support */
      * {
        scrollbar-width: thin;
        scrollbar-color: rgba(0, 0, 0, 0.35) rgba(0, 0, 0, 0.08);
      }
    </style>
  </head>
  <body class="font-sans antialiased text-gray-900 select-none overflow-hidden m-0 p-0 h-screen w-screen">
    <div id="root" class="h-full w-full overflow-hidden"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
